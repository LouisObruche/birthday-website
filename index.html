<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>30th Birthday Tribute</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&display=swap');

:root{
    --gold:#d4af37;
    --dark:#070b16;
    --card:#111827;
    --text:#e5e7eb;
}

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}

body{
    background: radial-gradient(circle at top, rgba(212,175,55,0.12), transparent 40%),
                linear-gradient(to bottom, #020617, var(--dark));
    color:var(--text);
    font-family: 'Great Vibes', cursive;
font-family: 'Poppins', sans-serif;
    overflow-x:hidden;
}

/* ================= CINEMATIC INTRO ================= */
#intro{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation:fadeOut 1s ease 3s forwards;
}

#intro h1{
    color:var(--gold);
    font-size:2.8rem;
    animation:zoom 2s ease;
    letter-spacing:3px;
}

#intro p{
    opacity:0.7;
    margin-top:10px;
}

@keyframes zoom{
    from{transform:scale(0.6);opacity:0}
    to{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
    to{opacity:0;visibility:hidden}
}

/* ================= FLOATING BACKGROUND ELEMENTS ================= */
.star{
    position:absolute;
    width:6px;
    height:6px;
    background:var(--gold);
    border-radius:50%;
    opacity:0.6;
    animation:floatStar 6s infinite ease-in-out;
}

@keyframes floatStar{
    0%{transform:translateY(0);opacity:0.3}
    50%{transform:translateY(-20px);opacity:1}
    100%{transform:translateY(0);opacity:0.3}
}

/* balloons */
.balloon{
    position:absolute;
    width:40px;
    height:60px;
    background:rgba(212,175,55,0.2);
    border:1px solid rgba(212,175,55,0.4);
    border-radius:50%;
    animation:floatBalloon 8s infinite ease-in-out;
}

@keyframes floatBalloon{
    0%{transform:translateY(0)}
    50%{transform:translateY(-30px)}
    100%{transform:translateY(0)}
}

/* ================= TITLE ================= */
.title{
    text-align:center;
    font-family:'Titan One';
    font-size:3rem;
    margin-top:40px;
}

.title span{
    display:inline-block;
    opacity:0;
    transform:translateY(40px);
    animation:drop 0.6s forwards;
}

@keyframes drop{
    to{opacity:1;transform:translateY(0)}
}

.title .gold{color:var(--gold)}

/* ================= IMAGE ================= */
.content{
    display:flex;
    justify-content:center;
    margin-top:40px;
}

.image{
    width:320px;
    height:100%;
    border-radius:20px;
    overflow:hidden;
    border:2px solid rgba(212,175,55,0.4);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    animation:floatImage 5s infinite ease-in-out;
}

@keyframes floatImage{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

.image img{width:100%;height:100%;object-fit:cover}

/* ================= BUTTON ================= */
button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    background:linear-gradient(to right,var(--gold),#f5d76e);
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* ================= MEMORY ================= */
section{padding:100px 20px}

h2{
    text-align:center;
    color:var(--gold);
    margin-bottom:40px;
    font-size:2.2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.04);
    border-radius:15px;
    overflow:hidden;
    transform:translateY(50px);
    opacity:0;
    transition:1s;
}

.card.show{
    transform:translateY(0);
    opacity:1;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.media-grid-section{
    padding:100px 20px;
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(220px,1fr));
    gap:20px;
    justify-items:center;
    max-width:1100px;
    margin:0 auto;
}

.media-card{
    background:rgba(255,255,255,0.04);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
    width:100%;
    max-width:360px;
    min-height:260px;
}

.media-card:nth-child(5){
    grid-column:1 / -1;
    justify-self:center;
    max-width:420px;
}

.media-card img,
.media-card video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.media-card video{
    min-height:220px;
}

/* ================= VIDEO ================= */
.video-container{
    width: 100%;
    height: 60vh;
    display:flex;
    gap:20px;
    align-items:center;
    flex-wrap:wrap;
}

.video-container video{
    flex:1 1 45%;
    width:100%;
    height:auto;
    min-width:300px;
    border-radius:15px;
    object-fit:cover;
}

/* ================= LETTER ================= */
.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
}

.modal{
    background:#111827;
    width:70%;
    margin:10% auto;
    padding:20px;
    border-radius:15px;
}

.close{
    text-align:right;
    cursor:pointer;
    color:var(--gold);
}

/* typing cursor */
#typing::after{
    content:"|";
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

/* floating subtle glow */
.glow{
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle, rgba(212,175,55,0.15), transparent);
    filter:blur(20px);
    animation:moveGlow 10s infinite ease-in-out;
}

@keyframes moveGlow{
    0%{transform:translate(0,0)}
    50%{transform:translate(50px,30px)}
    100%{transform:translate(0,0)}
}
#hero{
    width: 100%;
    height: 100%;
    background:rgba(255,255,255,0.04);
    margin:auto;
    padding:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>A Tribute to a King</h1>
    <p>30 Years of Excellence</p>
</div>

<!-- BACKGROUND FX -->
<div class="star" style="top:20%;left:10%"></div>
<div class="star" style="top:40%;left:80%"></div>
<div class="star" style="top:70%;left:30%"></div>

<div class="balloon" style="top:30%;left:5%"></div>
<div class="balloon" style="top:60%;right:10%"></div>

<div class="glow" style="top:10%;left:40%"></div>

<div id="wrapper">

<!-- TITLE -->
<div class="title" id="title"></div>

<!-- IMAGE -->
<div class="content">
    <div>
        <div class="image">
            <img src="./images/voke1.jpeg">
        </div>
        <button id="open">Open Message</button>
    </div>
</div>

<!-- MEMORY -->
<section>
    <h2>30 Years of Greatness</h2>
    <div class="grid">

        <div class="card">
            <img src="./images/voke3.jpeg">
        </div>

        <div class="card">
            <img src="./images/voke4.jpeg">
        </div>

        <div class="card">
            <img src="./images/voke5.jpeg">
        </div>

    </div>
</section>

<section class="media-grid-section">
    <h2>Gallery</h2>
    <div class="media-grid">
        <div class="media-card">
            <img src="./images/pic1.jpeg" alt="Memory photo 1">
        </div>
        <div class="media-card">
            <video src="./images/fav2.mp4" loop autoplay muted></video>
        </div>
        <div class="media-card">
            <img src="./images/pic3.jpeg" alt="Memory photo 3">
        </div>
        <div class="media-card">
            <video src="./images/fav1.mp4" loop autoplay muted></video>
        </div>
        <div class="media-card">
            <img src="./images/pic4.jpeg" alt="Memory photo 5">
        </div>
    </div>
</section>

<!-- VIDEO -->
<section id="hero">
    <h2>Memories & Moments</h2>
    <div class="video-container">
    <video controls autoplay muted loop>
        <source src="./images/vid1.mp4" 
    </video>
    <video src="./images/vid2.mp4" controls autoplay muted loop></video>
    </div>
</section>

</div>

<!-- LETTER -->
<div class="overlay">
    <div class="modal">
        <div class="close">Close ✖</div>
        <h2>To a King</h2>
        <p id="typing"></p>
    </div>
</div>

<script>

/* SPLIT TITLE ANIMATION */
const titleText = "Happy Birthday, Utom Mi!";
const title = document.getElementById("title");

[...titleText].forEach((char,i)=>{
    let span = document.createElement("span");
    span.textContent = char;
    span.style.animationDelay = (i*0.1)+"s";
    if(char===" ") span.style.width="10px";
    if(i>5) span.classList.add("gold");
    title.appendChild(span);
});

/* LETTER */
$("#open").click(()=>{
    $(".overlay").fadeIn();

    let text = `Happy 30th birthday, my love,

Today feels special not just because you’re turning a new age, but because I get to celebrate the life of a man who means so much to me. Thirty looks good on you  not just in years, but in the strength, calm, and quiet confidence you carry through everything you do.

Loving you has been one of the most beautiful parts of my life. You make ordinary days feel lighter, and difficult days feel possible. With you, I’ve found a kind of peace I didn’t even know I was looking for.

As you step into this new decade, I hope life rewards you with everything your heart has been working for  success, growth, joy, and moments that make you smile without even trying. And I hope I get to be right there beside you, through all of it, cheering you on and loving you more with every passing year.

You’re not just my boyfriend you’re my favorite person, my safe place, and my greatest blessing.

Happy 30th birthday, baby. I love you more than words will ever fully capture.`;
    let i=0;

    $("#typing").text("");

    let type = setInterval(()=>{
        $("#typing").append(text[i]);
        i++;
        if(i>=text.length) clearInterval(type);
    },35);
});

$(".close").click(()=> $(".overlay").fadeOut());

/* SCROLL REVEAL */
function reveal(){
    document.querySelectorAll(".card").forEach(el=>{
        let top = el.getBoundingClientRect().top;
        if(top < window.innerHeight-100){
            el.classList.add("show");
        }
    });
}

window.addEventListener("scroll",reveal);
reveal();

</script>

</body>
</html>
